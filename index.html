<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Уншлагын Аялал 🚀</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --p: #6366f1; --s: #22c55e; --e: #ef4444; --bg: #f8fafc; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
        
        .container { background: white; width: 100%; max-width: 450px; border-radius: 24px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .lvl-badge { background: #e0e7ff; color: var(--p); padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; display: inline-block; }
        .score-txt { font-size: 42px; font-weight: 900; color: var(--p); margin: 10px 0; }
        
        .text-display { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 20px 0; min-height: 80px; }
        .word-node { font-size: 22px; padding: 2px 4px; border-bottom: 3px solid #f1f5f9; transition: 0.3s; }
        .is-correct { color: var(--s); border-bottom-color: var(--s); font-weight: bold; }
        .is-wrong { color: var(--e); border-bottom-color: var(--e); opacity: 0.5; }

        .live-monitor { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 16px; font-family: monospace; font-size: 15px; min-height: 50px; margin: 15px 0; border-left: 4px solid var(--p); overflow-wrap: break-word; }

        .btn { width: 100%; padding: 18px; font-size: 18px; border-radius: 16px; border: none; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; margin-bottom: 10px; }
        .btn-mic { background: var(--p); box-shadow: 0 4px 0 #4338ca; }
        .btn-mic.recording { background: var(--e); box-shadow: 0 4px 0 #991b1b; animation: pulse 1.5s infinite; }
        .btn-check { background: var(--s); box-shadow: 0 4px 0 #15803d; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        
        .history { margin-top: 20px; font-size: 12px; color: #64748b; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div id="lvlInfo" class="lvl-badge">ТҮВШИН 1 / 5</div>
    <div id="scoreDisplay" class="score-txt">0%</div>
    <h3 id="title" style="margin: 5px 0;">Сэдэв</h3>

    <div class="text-display" id="mainText"></div>

    <div style="font-size: 10px; color: #94a3b8; font-weight: bold; text-align: left;">СОНСОГДОЖ БУЙ БИЧВЭР:</div>
    <div class="live-monitor" id="monitor">...</div>

    <button id="micBtn" class="btn btn-mic">🎤 Уншиж эхлэх</button>
    <button id="checkBtn" class="btn btn-check" style="display:none;">✅ Шалгах</button>

    <div class="history" id="history"></div>
</div>

<script>
    const levels = [
        { t: "Өвлийн баяр ❄️", content: "Гадаа цас орж байна Хүүхдүүд цасан хүн хийлээ Шинэ жил удахгүй болно" },
        { t: "Ажилсаг зөгий 🐝", content: "Зөгий цэцэгнээс бал цуглуулдаг Тэд маш ажилсаг амьтад Зөгийн бал амттай бас тустай" },
        { t: "Алтан намар 🍂", content: "Намар болж навчис шарлалаа Тариаланчид ургацаа хурааж байна Хүүхдүүд хичээлдээ орлоо" },
        { t: "Номын ертөнц 📚", content: "Ном бол ертөнцийг харах цонх Би ном унших дуртай Номноос би олон зүйл сурдаг" },
        { t: "Миний мөрөөдөл ✨", content: "Би ирээдүйд эмч болно Хүмүүст туслах нь миний мөрөөдөл Би хичээлээ шамдан сурдаг" }
    ];

    let currentLvl = 0;
    let isRecording = false;
    let recognition;

    // Гар утасны хөтөч дээр Speech Recognition-ийг идэвхжүүлэх
    try {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'mn-MN';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let result = "";
                for (let i = 0; i < event.results.length; i++) {
                    result += event.results[i][0].transcript;
                }
                document.getElementById('monitor').innerText = result;
            };

            recognition.onerror = (e) => {
                console.log("Error:", e.error);
                if(e.error === 'not-allowed') alert("Микрофон ашиглах зөвшөөрөл өгнө үү!");
            };
        }
    } catch (e) {
        alert("Таны хөтөч дуу таних функцийг дэмжихгүй байна. Chrome ашиглаарай.");
    }

    function loadLevel() {
        const container = document.getElementById('mainText');
        container.innerHTML = '';
        levels[currentLvl].content.split(" ").forEach((word, i) => {
            const span = document.createElement('span');
            span.innerText = word;
            span.className = 'word-node';
            span.id = `w-${i}`;
            container.appendChild(span);
        });
        document.getElementById('title').innerText = levels[currentLvl].t;
        document.getElementById('lvlInfo').innerText = `ТҮВШИН ${currentLvl+1} / 5`;
        document.getElementById('monitor').innerText = "...";
        document.getElementById('scoreDisplay').innerText = "0%";
    }

    document.getElementById('micBtn').onclick = () => {
        if (!isRecording) {
            if (!recognition) return alert("Таних систем ажиллахгүй байна.");
            recognition.start();
            isRecording = true;
            document.getElementById('micBtn').innerText = "⏹️ Зогсоох";
            document.getElementById('micBtn').classList.add('recording');
            document.getElementById('checkBtn').style.display = "none";
        } else {
            recognition.stop();
            isRecording = false;
            document.getElementById('micBtn').innerText = "🎤 Дахин унших";
            document.getElementById('micBtn').classList.remove('recording');
            document.getElementById('checkBtn').style.display = "block";
        }
    };

    document.getElementById('checkBtn').onclick = () => {
        const spoken = document.getElementById('monitor').innerText.toLowerCase();
        const words = levels[currentLvl].content.split(" ");
        let correct = 0;

        words.forEach((word, i) => {
            const cleanWord = word.toLowerCase().replace(/[.,!]/g, "");
            const el = document.getElementById(`w-${i}`);
            if (spoken.includes(cleanWord)) {
                el.className = 'word-node is-correct';
                correct++;
            } else {
                el.className = 'word-node is-wrong';
            }
        });

        const score = Math.round((correct / words.length) * 100);
        document.getElementById('scoreDisplay').innerText = score + "%";

        if (score >= 60) {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            setTimeout(() => {
                currentLvl = (currentLvl + 1) % levels.length;
                loadLevel();
            }, 2000);
        }
    };

    loadLevel();
</script>
</body>
</html>
