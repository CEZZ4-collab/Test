<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Уншлагын Аялал 🚀</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --p: #6366f1; --s: #22c55e; --e: #ef4444; --bg: #f8fafc; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); 
            margin: 0;
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }

        /* Үндсэн контейнер - PC дээр өргөн харагдана */
        .container { 
            background: white; 
            width: 100%; 
            max-width: 900px; 
            margin: 20px;
            border-radius: 30px; 
            padding: 40px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.05); 
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        /* ГАР УТАСНЫ ТОХИРГОО (600px-ээс бага дэлгэцтэй үед) */
        @media (max-width: 600px) {
            .container { margin: 10px; padding: 20px; border-radius: 20px; }
            .score-txt { font-size: 45px !important; }
            .word-node { font-size: 24px !important; }
            .btn { width: 100% !important; margin: 8px 0 !important; font-size: 18px !important; padding: 18px !important; }
            .live-monitor { font-size: 16px !important; min-height: 50px !important; }
        }
        
        .lvl-badge { background: #e0e7ff; color: var(--p); padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 14px; display: inline-block; align-self: center; }
        .score-txt { font-size: 65px; font-weight: 900; color: var(--p); margin: 10px 0; }

        /* Эх текст харуулах хэсэг */
        .text-display { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 10px; 
            margin: 25px 0; 
            padding: 20px;
            background: #fdfbff;
            border-radius: 20px;
            min-height: 120px; 
        }
        .word-node { 
            font-size: 36px; 
            padding: 2px 8px; 
            border-radius: 8px; 
            color: #334155; 
            border-bottom: 4px solid #f1f5f9;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .is-correct { color: var(--s) !important; border-bottom-color: var(--s) !important; transform: scale(1.05); font-weight: bold; }
        .is-wrong { color: var(--e) !important; border-bottom-color: var(--e) !important; opacity: 0.5; }

        /* Сонсож буй текст - Monitor */
        .live-monitor { 
            background: #0f172a; 
            color: #38bdf8; 
            padding: 20px; 
            border-radius: 15px; 
            font-family: 'Courier New', monospace; 
            font-size: 20px; 
            text-align: left; 
            margin: 20px 0; 
            min-height: 70px; 
            border-left: 6px solid var(--p);
            word-break: break-word;
        }

        /* Товчлуурууд */
        .btn-group { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 10px; }
        .btn { 
            padding: 20px 45px; 
            font-size: 20px; 
            border-radius: 50px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s; 
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-mic { background: var(--p); box-shadow: 0 6px 0 #4338ca; }
        .btn-check { background: var(--s); box-shadow: 0 6px 0 #15803d; }
        .btn:active { transform: translateY(3px); box-shadow: none; }
        
        .btn-mic.recording { 
            background: var(--e); 
            box-shadow: 0 6px 0 #991b1b; 
            animation: pulse 1.5s infinite; 
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* Түүх хадгалах хэсэг */
        .log-section { 
            margin-top: 40px; 
            text-align: left; 
            font-size: 13px; 
            color: #64748b; 
            border-top: 2px solid #f1f5f9; 
            padding-top: 20px;
        }
        .history-item { border-bottom: 1px solid #f1f5f9; padding: 10px 0; display: flex; justify-content: space-between; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="lvl-badge" id="lvlInfo">ТҮВШИН 1 / 15</div>
    <div class="score-txt" id="scoreDisplay">0%</div>
    <h2 id="title" style="margin: 5px 0;">Уншлагын Даалгавар</h2>

    <div class="text-display" id="mainText"></div>

    <div style="text-align: left; font-weight: bold; color: #94a3b8; font-size: 11px; padding-left: 5px;">МИНИЙ УНШИЖ БУЙ ТЕКСТ:</div>
    <div class="live-monitor" id="monitor">...</div>

    <div class="btn-group">
        <button id="micBtn" class="btn btn-mic">🎤 Уншиж эхлэх</button>
        <button id="checkBtn" class="btn btn-check hidden">✅ Шалгаад дараагийнх руу</button>
    </div>

    <div class="log-section">
        <b>📜 Сүүлийн 5 оролдлого:</b>
        <div id="historyContainer"></div>
    </div>
</div>

<script>
    const levels = [
        { t: "Усны шувуу 🦆", content: "Урин хавар ирлээ Гол мөрөн нуурын мөс хайлав" },
        { t: "Богд уул 🏔️", content: "Богд уул Улаанбаатар хотын өмнө оршдог" },
        { t: "Зараа 🦔", content: "Зараа их тайван амьтан Харин үнэрлэхдээ их сайн" },
        { t: "Жимсний зууш 🍎", content: "Ээж дэлгүүрээс олон төрлийн жимс авлаа" },
        { t: "Эх орон 🇲🇳", content: "Монгол бол миний эх орон Би эх орондоо хайртай" }
        // Энд нэмэлт түвшнүүдээ өмнөх шигээ нэмж болно
    ];

    let currentLvl = 0;
    let isRecording = false;
    let finalTranscript = "";
    let recognition;

    // Speech Recognition Setup (PC & Mobile)
    try {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'mn-MN';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (event) => {
            let interim = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const text = event.results[i][0].transcript.toLowerCase();
                if (event.results[i].isFinal) finalTranscript += text + " ";
                interim += text;
            }
            document.getElementById('monitor').innerText = finalTranscript + interim;
        };

        recognition.onerror = (e) => {
            if(e.error === 'not-allowed') alert("Микрофон ашиглах эрх өгнө үү!");
            isRecording = false;
            updateUI();
        };
    } catch (e) {
        alert("Таны хөтөч дуу таних функцийг дэмжихгүй байна.");
    }

    function loadLevel() {
        const textContainer = document.getElementById('mainText');
        textContainer.innerHTML = '';
        levels[currentLvl].content.split(" ").forEach((w, i) => {
            const span = document.createElement('span');
            span.innerText = w;
            span.className = 'word-node';
            span.id = `word-${i}`;
            textContainer.appendChild(span);
        });

        document.getElementById('title').innerText = levels[currentLvl].t;
        document.getElementById('lvlInfo').innerText = `ТҮВШИН ${currentLvl + 1} / ${levels.length}`;
        document.getElementById('scoreDisplay').innerText = "0%";
        document.getElementById('monitor').innerText = "Бэлэн...";
        document.getElementById('checkBtn').classList.add('hidden');
        document.getElementById('micBtn').classList.remove('hidden');
        finalTranscript = "";
        updateUI();
    }

    function updateUI() {
        const btn = document.getElementById('micBtn');
        if (isRecording) {
            btn.classList.add('recording');
            btn.innerText = "⏹️ Зогсоох";
        } else {
            btn.classList.remove('recording');
            btn.innerText = "🎤 Уншиж эхлэх";
        }
    }

    document.getElementById('micBtn').onclick = () => {
        if (!isRecording) {
            finalTranscript = "";
            recognition.start();
            isRecording = true;
        } else {
            recognition.stop();
            isRecording = false;
            document.getElementById('micBtn').classList.add('hidden');
            document.getElementById('checkBtn').classList.remove('hidden');
        }
        updateUI();
    };

    document.getElementById('checkBtn').onclick = () => {
        const originalWords = levels[currentLvl].content.split(" ");
        const spokenCombined = document.getElementById('monitor').innerText.toLowerCase();
        let correctCount = 0;

        originalWords.forEach((word, i) => {
            const target = word.toLowerCase().replace(/[.,!]/g, "");
            const span = document.getElementById(`word-${i}`);

            if (spokenCombined.includes(target)) {
                span.className = 'word-node is-correct';
                correctCount++;
            } else {
                span.className = 'word-node is-wrong';
            }
        });

        const score = Math.round((correctCount / originalWords.length) * 100);
        document.getElementById('scoreDisplay').innerText = score + "%";

        saveToLocal(score);

        if (score >= 60) {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            setTimeout(nextLevel, 2500);
        } else {
            alert("Оноо бага байна, дахин оролдоорой! 😊");
            document.getElementById('checkBtn').classList.add('hidden');
            document.getElementById('micBtn').classList.remove('hidden');
        }
    };

    function nextLevel() {
        currentLvl = (currentLvl + 1) % levels.length;
        loadLevel();
    }

    function saveToLocal(score) {
        const history = JSON.parse(localStorage.getItem('reading_pro_history') || "[]");
        history.unshift({
            topic: levels[currentLvl].t,
            score: score + "%",
            time: new Date().toLocaleTimeString()
        });
        localStorage.setItem('reading_pro_history', JSON.stringify(history.slice(0, 5)));
        renderHistory();
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('reading_pro_history') || "[]");
        document.getElementById('historyContainer').innerHTML = history.map(h => `
            <div class="history-item">
                <span><b>${h.topic}</b></span>
                <span style="color:var(--p)">${h.score}</span>
                <small>${h.time}</small>
            </div>
        `).join("");
    }

    loadLevel();
    renderHistory();
</script>

</body>
</html>
