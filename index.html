<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Уншлагын Аялал 🚀</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --p: #6366f1; --s: #22c55e; --e: #ef4444; --bg: #fdfbff; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            padding: 10px; 
            margin: 0;
            min-height: 100vh;
        }

        .container { 
            background: white; 
            width: 100%; 
            max-width: 500px; /* Утасны дэлгэцэнд тохируулав */
            border-radius: 20px; 
            padding: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
            text-align: center;
            display: flex;
            flex-direction: column;
        }
        
        .lvl-badge { 
            background: #e0e7ff; 
            color: var(--p); 
            padding: 6px 12px; 
            border-radius: 15px; 
            font-weight: bold; 
            font-size: 14px;
            align-self: center;
        }

        .score-txt { font-size: 40px; font-weight: 900; color: var(--p); margin: 5px 0; }

        /* Эх текст - Гар утсанд зориулж үсгийн хэмжээг бага зэрэг хасав */
        .text-display { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 6px; 
            margin: 15px 0; 
            min-height: 80px; 
        }
        .word-node { 
            font-size: 22px; 
            padding: 2px 6px; 
            border-radius: 6px; 
            color: #334155; 
            transition: 0.3s; 
            border-bottom: 3px solid #f1f5f9; 
        }
        .is-correct { color: var(--s) !important; border-bottom-color: var(--s); transform: translateY(-2px); font-weight: bold; }
        .is-wrong { color: var(--e) !important; border-bottom-color: var(--e); opacity: 0.6; }

        /* Сонсож буй текст - Утсан дээр илүү тод */
        .live-monitor { 
            background: #0f172a; 
            color: #38bdf8; 
            padding: 15px; 
            border-radius: 12px; 
            font-family: monospace; 
            font-size: 16px; 
            text-align: left; 
            margin: 15px 0; 
            min-height: 60px; 
            word-break: break-word;
            border-left: 4px solid var(--p);
        }

        .btn-group { 
            display: flex; 
            flex-direction: column; /* Утсан дээр товчнууд дээр дээрээ байвал амар */
            gap: 10px; 
            margin-top: 10px; 
        }
        
        .btn { 
            width: 100%;
            padding: 18px; 
            font-size: 18px; 
            border-radius: 15px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s; 
            color: white; 
            touch-action: manipulation;
        }
        
        .btn-mic { background: var(--p); box-shadow: 0 4px 0 #4338ca; }
        .btn-check { background: var(--s); box-shadow: 0 4px 0 #15803d; display: none; }
        .btn-mic.recording { background: var(--e); box-shadow: 0 4px 0 #991b1b; animation: blink 1s infinite; }

        @keyframes blink { 50% { opacity: 0.8; } }

        .log-section { 
            margin-top: 20px; 
            text-align: left; 
            font-size: 12px; 
            color: #64748b; 
            border-top: 2px solid #f1f5f9; 
            padding-top: 15px;
            overflow-y: auto;
            max-height: 200px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="lvl-badge" id="lvlInfo">ТҮВШИН 1 / 5</div>
    <div class="score-txt" id="scoreDisplay">0%</div>
    <h3 id="title" style="margin: 10px 0;">Сэдэв</h3>

    <div class="text-display" id="mainText"></div>

    <div style="text-align: left; font-weight: bold; color: #94a3b8; font-size: 10px; letter-spacing: 1px;">МИНИЙ УНШИЖ БУЙ БИЧВЭР:</div>
    <div class="live-monitor" id="monitor">...</div>

    <div class="btn-group">
        <button id="micBtn" class="btn btn-mic">🎤 Уншиж эхлэх</button>
        <button id="checkBtn" class="btn btn-check">✅ Шалгаад дараагийнх руу</button>
    </div>

    <div class="log-section">
        <b>СҮҮЛИЙН ТҮҮХ:</b>
        <div id="historyContainer"></div>
    </div>
</div>

<script>
    const levels = [
        { t: "Өвлийн баяр ❄️", content: "Гадаа цас орж байна Хүүхдүүд цасан хүн хийлээ Шинэ жил удахгүй болно" },
        { t: "Ажилсаг зөгий 🐝", content: "Зөгий цэцэгнээс бал цуглуулдаг Тэд маш ажилсаг амьтад Зөгийн бал амттай бас тустай" },
        { t: "Алтан намар 🍂", content: "Намар болж навчис шарлалаа Тариаланчид ургацаа хурааж байна Хүүхдүүд хичээлдээ орлоо" },
        { t: "Номын ертөнц 📚", content: "Ном бол ертөнцийг харах цонх Би ном унших дуртай Номноос би олон зүйл сурдаг" },
        { t: "Миний мөрөөдөл ✨", content: "Би ирээдүйд эмч болно Хүмүүст туслах нь миний мөрөөдөл Би хичээлээ шамдан сурдаг" }
    ];

    let currentLvl = 0;
    let isRecording = false;
    let finalTranscript = "";

    // Speech recognition setup (Mobile compatible)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'mn-MN';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (event) => {
            let interim = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const text = event.results[i][0].transcript.toLowerCase();
                if (event.results[i].isFinal) finalTranscript += text + " ";
                else interim = text;
            }
            document.getElementById('monitor').innerText = finalTranscript + interim;
        };

        recognition.onerror = (event) => {
            console.error("Speech Error:", event.error);
            if (event.error === 'not-allowed') {
                alert("Микрофон ашиглах зөвшөөрөл өгнө үү.");
            }
            stopRecording();
        };

        recognition.onend = () => {
            if (isRecording) recognition.start(); // Keep listening if we didn't manually stop
        };
    } else {
        alert("Таны хөтөч дуу хоолой таних боломжгүй байна. Chrome ашиглаарай.");
    }

    function loadLevel() {
        const textContainer = document.getElementById('mainText');
        textContainer.innerHTML = '';
        const words = levels[currentLvl].content.split(" ");
        words.forEach((w, i) => {
            const span = document.createElement('span');
            span.innerText = w;
            span.className = 'word-node';
            span.id = `word-${i}`;
            textContainer.appendChild(span);
        });

        document.getElementById('title').innerText = levels[currentLvl].t;
        document.getElementById('lvlInfo').innerText = `ТҮВШИН ${currentLvl + 1} / ${levels.length}`;
        document.getElementById('monitor').innerText = "...";
        document.getElementById('scoreDisplay').innerText = "0%";
        document.getElementById('checkBtn').style.display = "none";
        finalTranscript = "";
    }

    function stopRecording() {
        isRecording = false;
        if(recognition) recognition.stop();
        document.getElementById('micBtn').classList.remove('recording');
        document.getElementById('micBtn').innerText = "🎤 Дахин унших";
        document.getElementById('checkBtn').style.display = "block";
    }

    document.getElementById('micBtn').onclick = () => {
        if (!isRecording) {
            finalTranscript = "";
            document.getElementById('monitor').innerText = "";
            try {
                recognition.start();
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                document.getElementById('micBtn').innerText = "⏹️ Зогсоох";
                document.getElementById('checkBtn').style.display = "none";
            } catch (e) { console.error(e); }
        } else {
            stopRecording();
        }
    };

    document.getElementById('checkBtn').onclick = () => {
        const originalWords = levels[currentLvl].content.split(" ");
        const spokenCombined = document.getElementById('monitor').innerText.toLowerCase();
        let correctCount = 0;

        originalWords.forEach((word, i) => {
            const target = word.toLowerCase().replace(/[.,!]/g, "");
            const span = document.getElementById(`word-${i}`);

            if (spokenCombined.includes(target)) {
                span.className = 'word-node is-correct';
                correctCount++;
            } else {
                span.className = 'word-node is-wrong';
            }
        });

        const score = Math.round((correctCount / originalWords.length) * 100);
        document.getElementById('scoreDisplay').innerText = score + "%";

        saveToLocal(score);

        if (score >= 60) {
            confetti({ particleCount: 100, spread: 60, origin: { y: 0.7 } });
            setTimeout(nextLevel, 2000);
        } else {
            alert("Жаахан хичээгээд, дахин нэг тод уншаарай! 😊");
        }
    };

    function nextLevel() {
        currentLvl++;
        if (currentLvl >= levels.length) {
            alert("Баяр хүргэе! Бүх түвшнийг дуусгалаа. 🎉");
            currentLvl = 0;
        }
        loadLevel();
    }

    function saveToLocal(score) {
        const history = JSON.parse(localStorage.getItem('reading_history_v2') || "[]");
        const log = {
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            topic: levels[currentLvl].t,
            score: score + "%",
            text: document.getElementById('monitor').innerText.substring(0, 50) + "..."
        };
        history.unshift(log);
        localStorage.setItem('reading_history_v2', JSON.stringify(history.slice(0, 5)));
        renderHistory();
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('reading_history_v2') || "[]");
        document.getElementById('historyContainer').innerHTML = history.map(h => `
            <div style="border-bottom: 1px solid #f1f5f9; padding: 10px 0;">
                <b>${h.topic} - <span style="color:var(--p)">${h.score}</span></b> <small style="float:right">${h.time}</small>
            </div>
        `).join("");
    }

    // Initialize
    loadLevel();
    renderHistory();
</script>

</body>
</html>
